apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chai-app 
  namespace: argocd 
  annotations:
    # The email notifier must be configured in argocd-notifications-cm.yaml, The `.email` is the name of the notifier,
    # i.e, `service.email` in the argocd-notifications-cm.yaml.
    
    # Subscribe to notifications when the app health is degraded.
    notifications.argoproj.io/subscribe.on-health-degraded.email: "preetrupapara247@gmail.com" 
    # you can add multiple email ids separated by comma like "<receiver@example.com>, <receiver2@example.com>"
    
    # Subscribe to notifications when the app is successfully deployed.
    notifications.argoproj.io/subscribe.on-deployed.email: "preetrupapara247@gmail.com"
spec:
  project: default
  source:
    repoURL: https://github.com/PreetR24/Argocd-practice.git 
    targetRevision: main
    path: argocd-demos/applicationsets/chai-app 
  destination:
    server: https://argocd-cluster-control-plane:6443
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true 

# Brief Info:
# This manifest enables GitOps for chai-app using ArgoCD.
# Notifications are set up for health degradation and deployment events.
# Automated sync ensures the cluster matches the desired state in Git.