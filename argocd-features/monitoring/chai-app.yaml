apiVersion: argoproj.io/v1alpha1
kind: Application               
metadata:
  name: chai-app                
  namespace: argocd             
spec:
  project: default              
  source:
    repoURL: https://github.com/PreetR24/Argocd-practice.git 
    targetRevision: main         
    path: argocd-demos/monitoring/chai-app    
  destination:
    server: https://argocd-cluster-control-plane:6443
    namespace: default            
  syncPolicy:
    automated:
      prune: true                
      selfHeal: true             
