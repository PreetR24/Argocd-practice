apiVersion: argoproj.io/v1alpha1 
kind: Application               
metadata:                       
  name: nginx-frontend          
  namespace: argocd             
spec:
  project: frontend-team        
  source:
    repoURL: https://github.com/PreetR24/argocd-demos.git 
    targetRevision: main     
    path: argocd-demos/ui_approach/nginx  
  destination:
    server: https://172.19.0.3:6443
    namespace: frontend          
  syncPolicy:                    
    automated:                   
      prune: true                
      selfHeal: true             
    syncOptions:                 
      - CreateNamespace=true     